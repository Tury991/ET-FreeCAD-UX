name: Windows local installer
on:
  push:
    branches: [feature/windows-first-v0.3b]
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - 'etux-package.json'
      - 'et_freecad_ux/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/windows-scripts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-install-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Diagnose parameter default scope (issue 9)
        shell: powershell
        run: |
          @'
          [CmdletBinding()]
          param([string]$SourceDirectory = $PSScriptRoot)
          Write-Host ('DEFAULT=[' + $SourceDirectory + '] BODY_ROOT=[' + $PSScriptRoot + ']')
          try { [IO.Path]::GetFullPath($SourceDirectory) } catch { Write-Host ('DEFAULT_ERROR=' + $_.Exception.Message) }
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'binding-probe.ps1')
          powershell.exe -NoProfile -File (Join-Path $env:RUNNER_TEMP 'binding-probe.ps1')
          pwsh.exe -NoProfile -File (Join-Path $env:RUNNER_TEMP 'binding-probe.ps1')
      - name: Windows PowerShell 5.1 isolated filesystem tests
        shell: powershell
        run: ./tests/windows/test-windows.ps1
      - name: PowerShell 7 isolated filesystem tests
        shell: pwsh
        run: ./tests/windows/test-windows.ps1
  freecad-offscreen:
    needs: local-install-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and extract official FreeCAD 1.1.3 portable archive (CI only)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FreeCAD113.7z'
          $runtime = Join-Path $env:RUNNER_TEMP 'FreeCAD113'
          Invoke-WebRequest -Uri 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Windows-x86_64-py311.7z' -OutFile $archive
          $expected = '9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'SHA256 FreeCAD non valido' }
          & 7z.exe x $archive ("-o" + $runtime) -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Estrazione FreeCAD fallita' }
      - name: Native Python, geometry, Ribbon and diagnostic offscreen
        shell: pwsh
        run: ./tools/windows/test-freecad113.ps1 -RuntimeRoot (Join-Path $env:RUNNER_TEMP 'FreeCAD113')
